name: Runner check

on:
  push:
    branches:
      - test/pytest-ci

jobs:

  check:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Show Python version
        run: python --version